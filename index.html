
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Acompanhamento Acadêmico</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Matheus Ribeiro Magalhães: layout profissional e organizado -->
    <main class="container">

        <header class="cabecalho">
            <span class="etiqueta">GESTÃO ACADÊMICA</span>
            <h1>Sistema de Acompanhamento Acadêmico</h1>
            <p>Consulte o desempenho escolar do aluno.</p>
        </header>

        <section class="formulario">

            <h2>Dados do aluno</h2>

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite o nome do aluno"
            >

            <h2>Notas das avaliações</h2>

            <!-- Matheus Ribeiro Magalhães:
                 inclusão da Nota 4 e organização das avaliações -->
            <div class="grupo-notas">

                <div>
                    <label for="nota1">Nota 1</label>
                    <input
                        type="number"
                        id="nota1"
                        min="0"
                        max="10"
                        step="any"
                        placeholder="0 a 10"
                    >
                </div>

                <div>
                    <label for="nota2">Nota 2</label>
                    <input
                        type="number"
                        id="nota2"
                        min="0"
                        max="10"
                        step="any"
                        placeholder="0 a 10"
                    >
                </div>

                <div>
                    <label for="nota3">Nota 3</label>
                    <input
                        type="number"
                        id="nota3"
                        min="0"
                        max="10"
                        step="any"
                        placeholder="0 a 10"
                    >
                </div>

                <div>
                    <label for="nota4">Nota 4</label>
                    <input
                        type="number"
                        id="nota4"
                        min="0"
                        max="10"
                        step="any"
                        placeholder="0 a 10"
                    >
                </div>

            </div>

            <!-- Evelyn Jasmine: cor lilás do botão -->
            <!-- Markus André: animações de interação -->
            <button type="button" id="btn-calcular">
                Calcular Média
            </button>

        </section>

        <!-- Wemerson Gustavo: três mensagens de resultado -->
        <section class="area-resultado" aria-live="polite">

            <h2>Resultado da avaliação</h2>

            <p id="resultado">
                Preencha os campos para calcular a média.
            </p>

        </section>

        <footer>
            Média mínima para aprovação: 7,0
        </footer>

    </main>

</body>
</html>
